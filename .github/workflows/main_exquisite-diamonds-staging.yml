name: Build and deploy Exquisite Diamonds standalone to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Install dependencies
        run: npm install
      - name: Build Next.js standalone
        run: npm run build
      - name: Assemble standalone deployment
        run: |
          mkdir -p deploy/.next
          cp -R .next/standalone/. deploy/
          cp -R .next/static deploy/.next/static
          if [ -d public ]; then cp -R public deploy/public; fi
      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deploy

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: deploy
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_8E7A7BBD6D6B449C98B7488148078CB0 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_D5C6F1D90FBA45C2B48B8CB30D934EE8 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_CA673E0D6C934CB0B4D1B307E76F6FA1 }}
      - name: Deploy standalone app to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'Exquisite-Diamonds-Staging'
          slot-name: 'Production'
          package: deploy
