name: Build and deploy Exquisite Diamonds Demo standalone to Azure
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Install dependencies
        run: npm install
      - name: Build Next.js standalone
        run: npm run build
      - name: Assemble standalone deployment
        run: |
          mkdir -p deploy/.next
          cp -R .next/standalone/. deploy/
          cp -R .next/static deploy/.next/static
          if [ -d public ]; then cp -R public deploy/public; fi
      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: demo-node-app
          path: deploy
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: demo-node-app
          path: deploy
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_0473C102D5254DF5A5092B690321942A }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_770C8DF50F3B40CC9770B3A0AF8694A7 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_DA9CD9D1C6AE436BAAD81DB43075DD97 }}
      - name: Deploy standalone app to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'Exquisite-Diamonds-Demo-Staging'
          slot-name: 'Production'
          package: deploy
